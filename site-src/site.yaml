# Global site configuration. Edit here, never in site/.
site_name: "global-nu"
site_url: "https://global-nu.org"
tagline: "Global analyses of neutrino oscillation data — Bari group"

# Navigation order. Each entry must match the `url` of a content file.
nav:
  - url: index.html
    label: Home
  - url: results.html
    label: Results
  - url: history.html
    label: Parameter history
  - url: digest.html
    label: arXiv digest
  - url: news.html
    label: News
  - url: conferences.html
    label: Conferences
  - url: resources.html
    label: Resources
  - url: search.html
    label: Search
  - url: about.html
    label: About

# Web analytics: GoatCounter site code — the NAME part of
# https://NAME.goatcounter.com. Same account as home.ba.infn.it/~marrone.
# GoatCounter counts pageviews without cookies, so no consent banner is
# needed. An empty string emits NO script tag at all: the built site then
# carries no trace of analytics.
#
# Note: this code is shared with the personal site, so both sites report into
# the same dashboard and their paths are interleaved. A second site under the
# same GoatCounter account (e.g. "global-nu") would keep the two separate —
# changing this one line is all it takes.
goatcounter: "global-nu"

# The citable parameter register: what the schema.org/Dataset block on
# history.html and the Zenodo deposit both say about it.
#
# doi is the Zenodo CONCEPT DOI — the one that always resolves to the newest
# version, not a per-version DOI. While it is empty the build emits no
# identifier, no citation_doi and no DOI line in llms.txt. That is deliberate
# and it is tested: a page states nothing it cannot support.
dataset:
  doi: ""
  creator:
    name: "Antonio Marrone"
    orcid: "0000-0001-6096-1880"
    affiliation: "Università di Bari and INFN Bari"
  license: "https://creativecommons.org/licenses/by/4.0/"
  related:
    paper_doi: "10.1103/PhysRevD.111.093006"
    arxiv: "2503.07752"

# Image pipeline (site-src/images-src/ -> site/images/)
images:
  max_side: 1600
  quality: 82
