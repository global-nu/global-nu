# The experiments shown on the world map.
#
# Each entry names the place in words; the coordinates are NOT typed here.
# tools/make_map.py resolves each `city`/`country` pair through OpenStreetMap
# and records what came back — the returned display name and the coordinates —
# in var/news/geocache.json, so every dot on the map can be traced to a lookup
# rather than to somebody's recollection. An entry that cannot be located is
# left off the map instead of being placed approximately.
#
# `kind` picks the colour, and matches the grouping used on the resources page.
# `url` must be the same link the resources page uses, so the two cannot drift.
#
# Ordering. Entries are grouped by `role` — what the experiment constrains in
# a global fit — and ranked within a group by its weight in the current fit:
# the datasets that dominate a constraint come first. `rank` records that
# position so the order is a claim on the page rather than a preference in
# somebody's head.
#
# `status` is a statement of fact about a real collaboration and follows the
# project's first rule: it is taken from the source named in `source` — the
# collaboration's own page, or the paper of its final dataset — and never from
# recollection. An experiment whose status cannot be established carries no
# `status` field, and the page then prints nothing rather than a guess.
#
# The same `name` may appear more than once, under different `role`s — see
# Super-Kamiokande, which constrains both `solar` and `atmospheric`. That is
# not a duplicate to merge: an experiment can constrain more than one thing,
# and each constraint is its own record, with its own rank and, where they
# differ, its own status and source. The tests compare the two files by the
# *set* of names, so a repeated name causes no failure.

