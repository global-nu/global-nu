  # ------------------------------------------------------------------ NuFit --
  # NuFit quotes Dm2_3l, defined as Dm2_31 > 0 for NO and Dm2_32 < 0 for IO,
  # and prints delta_CP in degrees only, so delta is not recorded for these
  # entries. Where the fit comes in variants, the one including Super-K
  # atmospheric data is taken, because that is what our own analysis includes.
  # Values below are as published; the conversion to our Dm2 is done by
  # tools/make_history.py and stated on the page.
  #
  # The two predecessor entries below (2001, 2004) are earlier IFIC-Valencia
  # global fits by the same lineage of authors, recorded as "nufit" per this
  # file's existing convention for predecessors. Their own conventions differ
  # from the pattern above and from each other, and are stated per-release:
  # the 2001 paper quotes tan^2(theta) rather than sin^2(theta) throughout and
  # does not fit an inverted ordering, and the 2004 paper quotes Dm2_31 > 0
  # with no inverted-ordering fit either (Dm2_3l as a NO-only quantity).

  - group: nufit
    year: 2001
    arxiv: "hep-ph/0009350"
    journal: "Phys. Rev. D 63, 033005 (2001)"
    title: "Global three-neutrino oscillation analysis of neutrino data"
    convention: "tan2(theta), not sin2(theta), for every mixing angle; Dm2_32 = m3^2-m2^2 reported without a normal/inverted split"
    table: "Table V/VI, \"Solar + ALL-ATM. + CHOOZ\" (global combined analysis)"
    note: >-
      Only dm2 could be safely recorded from this paper; every mixing angle
      and the atmospheric-type splitting are left out, for reasons that hold
      regardless of the text-normalisation fix below. Every mixing angle is
      quoted as tan2(theta), never sin2(theta) (Tables II-VI and the p.28
      summary, Eq. 37 area); our sin2_th12/13/23 fields specifically mean
      sin2(theta). Converting is a well-defined identity
      (sin2 = tan2/(1+tan2)), but there is no reported/converted mechanism for
      mixing angles in this codebase (unlike Dm2_3l/abs_Dm2_31 for the larger
      mass splitting), so it is left undone rather than hand-computed and
      passed off as printed. The atmospheric-type splitting Dm2_32 = m3^2-m2^2
      is reported without distinguishing normal from inverted ordering, so it
      does not match either branch of the later NuFit Dm2_3l convention
      (Dm2_31 for NO, Dm2_32 for IO) without imposing a hierarchy the paper
      itself never claims. For the record, the paper's global
      (Solar+ALL-ATM+CHOOZ) bound is tan2(theta13) < 0.055 (90% CL),
      < 0.085 (99% CL) -- but tan2(theta13) is not sin2(theta13).
      dm2 (Dm2_21 = 3.3e-5 eV2, "Solar+ALL-ATM.+CHOOZ, Unconst=LMA" row of
      Table V) is recorded with no s2/s3 range: Table VI quotes ranges only
      for tan2_th13, tan2_th23 and Dm2_32, not for Dm2_21 or theta12 (the
      paper defers those to a figure, Fig. 21).
    values:
      dm2: {"any": {best: 3.3}}

  - group: nufit
    year: 2004
    arxiv: "hep-ph/0405172"
    journal: "New J. Phys. 6, 122 (2004)"
    title: "Status of global fits to neutrino oscillations"
    convention: "Dm2_3l = Dm2_31 > 0; no inverted-ordering fit performed"
    reported_splitting: Dm2_3l
    table: "Table 1"
    note: >-
      The paper's original 2004 Table 1 (this record's source). Later arXiv
      revisions of this same preprint (v6, 2007) append updated Tables C1 and
      D1 from 2006 and 2007 data respectively; those are not used here, since
      this record is keyed to the 2004 journal publication (New J. Phys. 6,
      122), which carries only the original Table 1. No inverted-ordering fit
      is performed anywhere in the paper: Dm2_31 is given as a single positive
      value, recorded here under "no" only. No CP phase is fit either (delta
      is argued to be negligible for this analysis, Sec. 4.1). Table 1's
      sin2_th13 row reads "0.000  ≤0.028  ≤0.047" (best, 2σ, 3σ) — a limit,
      not a range with a printed lower endpoint — so it is recorded as an
      upper bound (3σ) rather than as best+s2/s3, per that row's own "≤".
    values:
      dm2:       {"any": {best: 8.1, s2: [7.5, 8.7], s3: [7.2, 9.1]}}
      sin2_th12: {"any": {best: 3.0, s2: [2.5, 3.4], s3: [2.3, 3.8]}}
      sin2_th13:
        "any": {upper: 4.7, level: "3sigma", source_quote: "Best-fit values, 2σ, 3σ, and 4σ intervals (1 d.o.f.)"}
      sin2_th23: {"any": {best: 5.0, s2: [3.8, 6.4], s3: [3.4, 6.8]}}
      Dm2_3l:
        "no": {best: 2.2, s2: [1.7, 2.9], s3: [1.4, 3.3]}

