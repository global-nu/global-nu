# Parameter history — source data.
#
# Every number here is transcribed by hand from the table named in `table` of
# the paper named in `arxiv`, and nothing else. No value is interpolated,
# averaged, read off a figure, or carried over from another release.
#
# tools/tests/test_history_numbers.py re-extracts each cited table from the
# cached PDF (var/history-sources/) and checks every value below against it.
# If that test fails, this file is wrong — not the test.
#
# Units follow the papers: values are given in the normalisation printed in
# the table itself (e.g. sin2_th12 in units of 1e-1), recorded in `unit`.
#
# Conventions:
#   dm2   = m2^2 - m1^2 > 0                     ("solar" splitting)
#   Dm2   = m3^2 - (m1^2 + m2^2)/2              (Bari convention)
# Other groups quote Dm2_31 or Dm2_23; when they are added to this file each
# entry must carry its own `convention` field, and the page must state the
# conversion. Bari entries all use the convention above.

meta:
  parameters:
    dm2:       {label: "δm²",      unit: "1e-5 eV²"}
    Dm2:       {label: "|Δm²|",    unit: "1e-3 eV²"}
    sin2_th12: {label: "sin²θ₁₂",  unit: "1e-1"}
    sin2_th13: {label: "sin²θ₁₃",  unit: "1e-2"}
    sin2_th23: {label: "sin²θ₂₃",  unit: "1e-1"}
    delta_pi:  {label: "δ/π",      unit: "1"}
  # As reported by the other groups, before conversion to our Dm2.
  reported:
    Dm2_3l:     {label: "Δm²₃ℓ",   unit: "1e-3 eV²"}
    abs_Dm2_31: {label: "|Δm²₃₁|", unit: "1e-3 eV²"}

