# Papers considered for this register and not included, with the reason. Kept
# here so a physicist who knows one of these papers finds the answer in the
# file rather than wondering whether it was simply missed.
excluded:
  - arxiv: "hep-ph/0206162"
    title: "Getting the most from the statistical analysis of solar neutrino oscillations"
    reason: >-
      Methodological: a study of statistical-analysis technique for the 2ν
      solar sector, not a parameter release.

  - arxiv: "hep-ph/0208026"
    title: "Three-flavor solar neutrino oscillations with terrestrial neutrino constraints"
    reason: >-
      A solar analysis with terrestrial constraints whose only table is a 2ν
      solar fit without CHOOZ — not a citable 3ν global-parameter table.

  - arxiv: "hep-ph/0212127"
    title: "Solar neutrino oscillation parameters after first KamLAND results"
    reason: >-
      Solar+CHOOZ+KamLAND analysis restricted to (δm², sin²θ₁₂, sin²θ₁₃);
      its only formal table (Table I) covers the 2ν (δm², θ₁₂) sector. The 3ν
      extension including θ₁₃ is shown solely in χ² contour figures (Figs.
      5-7), never tabulated, and atmospheric data enter only enough to
      marginalise Δm² away — no table quotes sin²θ₂₃ or a mass ordering.

  - arxiv: "hep-ph/0308055"
    title: "Addendum to: Solar neutrino oscillation parameters after first KamLAND results"
    reason: >-
      A 5-page addendum to hep-ph/0212127 updating the same restricted
      (δm², θ₁₂, θ₁₃) analysis with new SNO salt-phase data. Contains no
      table at all (checked programmatically against the cached PDF).

  - arxiv: "2001–2004 conference proceedings"
    title: "(various)"
    reason: >-
      Conference-proceedings write-ups from this period restate figures from
      the papers above rather than presenting their own citable table, so
      none is added as a separate point.

  - arxiv: "1806.11051"
    title: "Neutrino Mass Ordering from Oscillations and Beyond: 2018 Status and Future Prospects"
    reason: >-
      Its Table I carries forward the same fit as arXiv:1708.01186 as an
      input to a broader mass-ordering review, not a second, independent
      analysis: 9 of its 10 entries match 1708.01186 digit for digit, and the
      tenth (delta_pi, normal ordering) differs only in its best fit (1.32 vs
      1.21), with an identical 3σ range in both papers (see the note on the
      1708.01186 release, above, for the full comparison).

  - arxiv: "1001.4524"
    title: "Updated global fit to three neutrino mixing: status of the hints of θ13>0"
    reason: >-
      Considered for this pass and not added: no numbered table or equation
      exists anywhere in this 20-page paper for its headline six-parameter
      global fit (checked programmatically — zero "table" matches in the
      extracted text). The results are given only via figures (Figs. 1-9) and
      one unnumbered two-column display block on p. 16. The schema test's
      citation-format check accepts only a "Table N" or "Eq. (" citation by
      deliberate design, so nothing here can be cited without a change to
      that check, which is outside the scope of a data-only pass. For a later
      pass: the paper does give Δm²₂₁ (Sec. 2), |Δm²₃₁| for both orderings
      (Sec. 3, "the absolute best-fit lays in the positive Δm²₃₁ = +2.46e-3
      eV²... the local best-fit in the inverse mass ordering, Δm²₃₁ =
      -2.36e-3 eV²"), and a sin²θ₁₃ bound (p. 16, "θ13 = 5.6+3.0-2.7(≤12.5)°"
      converted to sin²θ₁₃ ≤ 0.047 for GS98) — all in that one unnumbered
      block, so recovering them needs the citation-format question resolved
      first, not a reading problem.
